services:
  scheduler-pg-test:
    image: postgres:15-alpine
    container_name: scheduler-pg-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TEST_DB_NAME:-scheduler_test}
      POSTGRES_USER: ${TEST_DB_USER:-scheduler_test}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-scheduler_test}
    ports:
      - "${TEST_DB_PORT:-54321}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
